[package]
name = "format_factory_conversion_worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.10"
image-webp = { version = "=0.2.4", default-features = false }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21"
unicode-general-category = "1"
encoding_rs = "0.8"
html5gum = { version = "0.8", default-features = false }

[profile.release]
strip = "symbols"
lto = "thin"
